<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./styles.css">
  <script src="./scripts.js" defer></script>
  <title>Weather Web-App</title>
</head>
<body>
<div class="card">
  <div class="search">
    <input
      id="input"
      name="input"
      type="text"
      placeholder="enter city name"
    />
    <button
      type="button"
    >
      <img
        src="./images/search.png"
        alt="search"
        width="18" height="20" loading="lazy"
      />
    </button>
  </div>
  <div class="error">
    <p>Invalid city name</p>
  </div>
  <div class="error_api">
    <p>API is not connected</p>
  </div>
  <div class="weather">
    <img src="" class="weather-icon">
    <h1 class="temp"></h1>
    <p>
      <span>feels like:</span>
      <span class="feels_like"></span>
    </p>
    <h2 class="city">-</h2>
    <div class="details">
      <div class="col">
        <img src="./images/humidity.png" width="40">
        <div>
          <p class="humidity">-</p>
          <p>Humidity</p>
        </div>
      </div>
      <div class="col">
        <img src="./images/wind.png" width="40">
        <div>
          <p class="wind">-</p>
          <p>Wind speed</p>
        </div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
